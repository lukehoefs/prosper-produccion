<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Prosper Producción</title>
  <meta name="description" content="Briefing diario MOS: impresiones, blancos, first-pass vs rechazo." />
  <meta name="theme-color" content="#0c0d0f" />

  <style>
    :root {

      --danger: #c45c4a;
      --warn: #c4a574;
      --ok: #7a9a82;
      --bar: #5c6573;
      --logged: #8b919c;
      --grid: color-mix(in oklab, var(--fg) 8%, transparent);
      --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); overflow-x: clip; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      -webkit-font-smoothing: antialiased;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: inherit; }
    .wrap {
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem max(1rem, env(safe-area-inset-left)) 2.5rem max(1rem, env(safe-area-inset-right));
    }
    header { border-bottom: 1px solid color-mix(in oklab, var(--fg) 12%, transparent); }
    header .wrap { display: flex; flex-direction: column; gap: 0.75rem; padding-bottom: 1rem; }
    .kicker { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
    h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.03em; margin: 0.25rem 0 0; }
    h2 { font-size: 1.125rem; font-weight: 500; letter-spacing: -0.02em; margin: 0.25rem 0 0; }
    .lede { max-width: 28rem; font-size: 0.875rem; line-height: 1.5; color: var(--muted); margin: 0; }
    .stack { display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--surface); border-radius: 20px; padding: 1rem; box-shadow: 0 0 0 1px color-mix(in oklab, var(--fg) 10%, transparent); }
    .inner { background: var(--raised); border-radius: 12px; padding: 0.75rem; min-width: 0; }
    .hero { display: flex; flex-direction: column; gap: 0.75rem; align-items: flex-start; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
    .xl { font-size: 2.25rem; letter-spacing: -0.03em; margin: 0.25rem 0 0; }
    .right { text-align: left; }
    .danger { color: var(--danger); }
    .warn { color: var(--warn); }
    .ok { color: var(--ok); }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); }
    .sm { font-size: 0.875rem; line-height: 1.5; }
    .xs { font-size: 0.75rem; line-height: 1.45; }
    .chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 12.5rem; margin-top: 1rem; }
    .col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: end; gap: 6px; min-width: 0; }
    .col.wide { display: none; }
    .bar { width: 100%; max-width: 36px; border-radius: 4px 4px 0 0; background: var(--bar); min-height: 2px; }
    .bar.today { background: var(--accent); }
    .bar.logged { background: var(--logged); }
    .bar.wk { background: var(--grid); }
    .legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
    .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .grid2 { display: grid; gap: 0.75rem; }
    .split { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
    .pipe { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
    .meter { height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 0.75rem; }
    .meter > span { display: block; height: 100%; border-radius: 999px; }
    ol.actions { margin: 1.25rem 0 0; padding: 0; list-style: none; }
    ol.actions li { display: flex; gap: 0.75rem; font-size: 0.875rem; line-height: 1.5; margin-bottom: 0.5rem; }
    ol.actions span { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; flex-shrink: 0; }
    p { margin: 0; }
    .mt { margin-top: 0.75rem; }
    .mt2 { margin-top: 1rem; }
    .row { display: flex; justify-content: space-between; gap: 0.75rem; align-items: start; }
    footer { font-size: 0.75rem; line-height: 1.5; color: var(--muted); }
    .wd { display: inline; }
    .dn { display: none; }
    @media (min-width: 640px) {
      header .wrap { flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: end; padding-bottom: 1.25rem; }
      .wrap { padding: 1.25rem 1.5rem 3rem; }
      .card { border-radius: 24px; padding: 1.25rem; }
      .inner { padding: 1rem; }
      .hero { flex-direction: row; justify-content: space-between; align-items: end; }
      .right { text-align: right; }
      .kicker { font-size: 0.75rem; }
      h1 { font-size: clamp(1.5rem, 2vw + 1rem, 1.875rem); }
      h2 { font-size: 1.25rem; }
      .xl { font-size: clamp(2.25rem, 4vw, 3rem); }
      .grid2 { grid-template-columns: 1fr 1fr; }
      .pipe { grid-template-columns: repeat(4, 1fr); }
      .chart { grid-template-columns: repeat(14, minmax(0, 1fr)); height: 20rem; gap: 6px; }
      .col.wide { display: flex; }
      .bar { max-width: 28px; }
      .wd { display: none; }
      .dn { display: inline; }
      .stack { gap: 1.25rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const FALLBACK = {"date":"2026-08-28","weekday":"viernes","titleDate":"viernes 28 ago","producedToday":26625,"machines":12,"last7Total":176359,"last7Daily":35272,"onMachineUnits":44670,"onMachineJobs":6,"readyUnits":3807,"readyJobs":4,"dueTodayUnits":0,"dueTodayOrders":0,"lateUnits":213189,"projection":35272,"next7Units":69630,"next7Orders":90,"blanksUnits":323576,"blanksOrders":183,"rejectPct":0.42,"capturedAt":"2026-08-28T06:30:01-07:00","source":"live-digest","byDay":[{"date":"2026-08-24","produced":36126},{"date":"2026-08-25","produced":36343},{"date":"2026-08-26","produced":32802},{"date":"2026-08-27","produced":50209}]};
    const WD_SHORT = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

    const fmt = (n) => Math.round(n).toLocaleString("en-US");
    const pct = (n) => n.toFixed(2);
    const days = (n, pace) => (pace ? n / pace : 0).toFixed(1);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

    function brief(s) {
      const gap = Math.max(0, s.last7Daily - s.producedToday);
      const pacePct = s.last7Daily ? (s.producedToday / s.last7Daily) * 100 : 0;
      const per = s.machines ? s.producedToday / s.machines : 0;
      const firstPass = 100 - s.rejectPct;
      const blanksDays = s.last7Daily ? s.blanksUnits / s.last7Daily : 0;
      const dueDays = s.last7Daily ? s.dueTodayUnits / s.last7Daily : 0;
      const lateDays = s.last7Daily ? s.lateUnits / s.last7Daily : 0;
      const feedHours = s.last7Daily ? s.onMachineUnits / (s.last7Daily / 10) : 0;
      const rejectLoss = s.last7Daily * (s.rejectPct / 100);
      const condition = pacePct >= 95 ? "ahead" : pacePct >= 70 ? "on-pace" : "behind";
      const headline = condition === "behind"
        ? "Debajo del ritmo de 7 días. El cuello no son las máquinas: son los blancos."
        : condition === "on-pace"
          ? "Ritmo recuperable si WMS suelta tela para lo que ya está atrasado."
          : "Al ritmo de 7 días o por encima.";
      const a1 = s.dueTodayOrders > 0
        ? `Liberar blancos primero para las ${s.dueTodayOrders} órdenes que vencen hoy — no para las ${s.blanksOrders} del board de blancos.`
        : `Hoy no vence nada nuevo. Blancos primero para las atrasadas (${fmt(s.lateUnits)}).`;
      const a2 = s.readyUnits < s.last7Daily * 0.5
        ? `Cola lista delgada (${fmt(s.readyUnits)}). No cargar de más a las ${s.machines} máquinas.`
        : `Programar desde listo (${fmt(s.readyUnits)}) sin inflar máquina.`;
      const a3 = s.rejectPct >= 5
        ? `QC: tratar el ${pct(s.rejectPct)}% de rechazo como parar-y-encontrar. Un punto más ≈ ${fmt(s.last7Daily * 0.01)} impresiones/día.`
        : `QC en ${pct(s.rejectPct)}% — rango sano (apparel 2–5%). No aflojar first-pass.`;
      return { gap, pacePct, per, firstPass, blanksDays, dueDays, lateDays, feedHours, rejectLoss, condition, headline, a1, a2, a3 };
    }

    function bars(s) {
      const logged = Object.fromEntries((s.byDay || []).map((d) => [d.date, d.produced]));
      const end = new Date(s.date + "T12:00:00");
      const out = [];
      for (let i = 13; i >= 0; i--) {
        const dt = new Date(end);
        dt.setDate(end.getDate() - i);
        const iso = dt.toISOString().slice(0, 10);
        const dow = dt.getDay();
        const isToday = iso === s.date;
        const isWeekend = dow === 0 || dow === 6;
        let impressions = 0, kind = "pace";
        if (isToday) { impressions = s.producedToday; kind = "today"; }
        else if (logged[iso] != null) { impressions = logged[iso]; kind = "logged"; }
        else if (isWeekend) { impressions = 0; kind = "weekend"; }
        else { impressions = s.last7Daily; kind = "pace"; }
        out.push({ iso, label: String(dt.getDate()), weekday: WD_SHORT[dow], impressions, kind, wide: i >= 7 });
      }
      return out;
    }

    function render(s) {
      const b = brief(s);
      const chart = bars(s);
      const max = Math.max(s.last7Daily, ...chart.map((c) => c.impressions), 1);
      const tone = b.condition === "behind" ? "danger" : b.condition === "ahead" ? "ok" : "warn";
      const condLabel = b.condition === "behind" ? "Por debajo del ritmo" : b.condition === "ahead" ? "Al ritmo o por encima" : "Ritmo recuperable";
      const pipeMax = Math.max(s.blanksUnits, s.readyUnits, s.onMachineUnits, s.producedToday, 1);
      const qcCopy = s.rejectPct >= 5
        ? `MOS QC guarda quantity_inspected y quantity_rejected. El digest viejo titulaba Calidad y pegaba el rechazo — por eso ${pct(s.rejectPct)}% se leía al revés. Apparel sano: 2–5% rechazo. ${pct(s.rejectPct)}% quema ~${fmt(b.rejectLoss)} impresiones/día.`
        : `First-pass es ${pct(b.firstPass)}%. Rechazo QC de 7 días está en ${pct(s.rejectPct)}%, dentro del rango sano de apparel (2–5%). Seguir midiendo unidades, no pass_rate de inspecciones.`;
      const dueNote = s.dueTodayOrders > 0
        ? `Lo que vence hoy (${fmt(s.dueTodayUnits)} en ${s.dueTodayOrders} órdenes) es ${days(s.dueTodayUnits, s.last7Daily)} días de trabajo — no cabe en el turno — más ${fmt(s.lateUnits)} ya atrasadas (${days(s.lateUnits, s.last7Daily)} días).`
        : `Hoy no hay vencimientos nuevos. El lastre son ${fmt(s.lateUnits)} ya atrasadas (${days(s.lateUnits, s.last7Daily)} días al ritmo actual).`;
      document.title = "Prosper Producción — " + s.titleDate;
      const captured = (s.capturedAt || "").replace("T", " ").replace("-07:00", " PDT").replace("-08:00", " PST");
      document.getElementById("app").innerHTML = `
  <header>
    <div class="wrap">
      <div>
        <p class="kicker">Prosper · MOS · #Production</p>
        <h1>Producción ${esc(s.titleDate)}</h1>
        <p class="sm mt"><a href="/fuentes.html">De dónde sale cada cifra</a></p>
      </div>
      <p class="lede">Briefing del corte MOS. Primary: impresiones/día. El cuello es blancos, no prensas. Calidad = first-pass, no el % de rechazo.</p>
    </div>
  </header>
  <div class="wrap stack">
    <section class="card">
      <div class="hero">
        <div>
          <p class="kicker">Impreso hoy (hasta ahora)</p>
          <p class="num xl">${fmt(s.producedToday)}</p>
          <p class="sm muted mt">${s.machines} máquinas · ${fmt(b.per)} c/u · first-pass estimado ${fmt(s.producedToday * b.firstPass / 100)}</p>
        </div>
        <div class="right">
          <p class="sm ${tone}">${b.pacePct.toFixed(0)}% del ritmo · ${condLabel}</p>
          <p class="sm muted num mt">Ritmo ${fmt(s.last7Daily)}/día</p>
          <p class="sm muted">Faltan ${fmt(b.gap)} para empatar</p>
        </div>
      </div>
      <div class="row mt2">
        <h2>Impresiones por día</h2>
        <p class="xs muted">7 días · 14 en pantalla ancha</p>
      </div>
      <div class="chart" aria-label="Impresiones diarias">
        ${chart.map((c) => {
          const h = c.kind === "weekend" || c.impressions === 0 ? 2 : Math.max(4, Math.round((c.impressions / max) * 100));
          const cls = c.kind === "today" ? "today" : c.kind === "weekend" ? "wk" : c.kind === "logged" ? "logged" : "";
          return `<div class="col${c.wide ? " wide" : ""}"><div class="bar ${cls}" style="height:${h}%"></div><span class="xs muted"><span class="wd">${c.wide ? c.label : c.weekday}</span><span class="dn">${c.label}</span></span></div>`;
        }).join("")}
      </div>
      <div class="legend xs muted">
        <span><i class="dot" style="background:var(--accent)"></i> Hoy (corte 7:30)</span>
        <span><i class="dot" style="background:var(--logged)"></i> Día cerrado MOS</span>
        <span><i class="dot" style="background:var(--bar)"></i> Ritmo 7 días</span>
        <span><i class="dot" style="background:var(--grid)"></i> Fin de semana</span>
      </div>
      <p class="xs muted mt">El corte de las 7:30 publica el total de 7 días (${fmt(s.last7Total)}). Las barras de días cerrados vienen de MOS by_day. Hoy es el corte, no el cierre de turno.</p>
    </section>
    <section class="card">
      <p class="kicker">Flujo de planta</p>
      <h2>De blancos a impreso</h2>
      <p class="sm muted mt">El trabajo se mueve izquierda a derecha. El cuello es el primer escalón: tela que no ha llegado.</p>
      <div class="pipe mt2">
        <div class="inner">
          <p class="kicker">01 · Esperando blancos</p>
          <p class="num xl danger" style="font-size:1.5rem">${fmt(s.blanksUnits)}</p>
          <p class="xs muted">${s.blanksOrders} órdenes</p>
          <div class="meter"><span style="width:100%;background:var(--danger)"></span></div>
          <p class="xs muted mt">${days(s.blanksUnits, s.last7Daily)} días parados — constraint</p>
        </div>
        <div class="inner">
          <p class="kicker">02 · Listo para programar</p>
          <p class="num xl warn" style="font-size:1.5rem">${fmt(s.readyUnits)}</p>
          <p class="xs muted">${s.readyJobs} trabajos</p>
          <div class="meter"><span style="width:${Math.max(4, Math.round(s.readyUnits / pipeMax * 100))}%;background:var(--warn)"></span></div>
          <p class="xs muted mt">Cola corta para rellenar prensas</p>
        </div>
        <div class="inner">
          <p class="kicker">03 · En máquina</p>
          <p class="num xl" style="font-size:1.5rem">${fmt(s.onMachineUnits)}</p>
          <p class="xs muted">${s.onMachineJobs} trabajos</p>
          <div class="meter"><span style="width:${Math.max(4, Math.round(s.onMachineUnits / pipeMax * 100))}%;background:var(--accent)"></span></div>
          <p class="xs muted mt">~${b.feedHours.toFixed(1)} h de alimento</p>
        </div>
        <div class="inner">
          <p class="kicker">04 · Impreso hoy</p>
          <p class="num xl ${tone}" style="font-size:1.5rem">${fmt(s.producedToday)}</p>
          <p class="xs muted">${s.machines} máquinas</p>
          <div class="meter"><span style="width:${Math.max(4, Math.round(s.producedToday / pipeMax * 100))}%;background:var(--${tone === "ok" ? "ok" : "warn"})"></span></div>
          <p class="xs muted mt">${b.pacePct.toFixed(0)}% del ritmo 7 días</p>
        </div>
      </div>
    </section>
    <section class="grid2">
      <article class="card">
        <p class="kicker">Calidad vs rechazo</p>
        <h2>No son la misma cifra</h2>
        <div class="split mt2">
          <div class="inner">
            <p class="kicker">First-pass</p>
            <p class="num xl ok">${pct(b.firstPass)}%</p>
            <p class="xs muted mt">Unidades que sí pasan. Esto es calidad. 100 − rechazo.</p>
          </div>
          <div class="inner">
            <p class="kicker">Rechazo QC</p>
            <p class="num xl ${s.rejectPct >= 5 ? "danger" : "ok"}">${pct(s.rejectPct)}%</p>
            <p class="xs muted mt">Scrap. ~${fmt(b.rejectLoss)} impresiones/día.</p>
          </div>
        </div>
        <p class="sm mt2">${qcCopy}</p>
      </article>
      <article class="card">
        <p class="kicker">Lectura</p>
        <h2>${esc(b.headline)}</h2>
        <p class="sm mt2">Hoy van ${fmt(s.producedToday)} impresiones en ${s.machines} máquinas (${fmt(b.per)} c/u). El ritmo publicado de 7 días es ${fmt(s.last7Daily)}/día (${fmt(s.last7Total)}). Faltan ${fmt(b.gap)} para empatar ese promedio.</p>
        <p class="sm mt">En prensa hay ${fmt(s.onMachineUnits)} unidades (${s.onMachineJobs} trabajos): ~${b.feedHours.toFixed(1)} h al ritmo actual. Listo para programar está delgado: ${fmt(s.readyUnits)} (${s.readyJobs} trabajos).</p>
        <p class="sm mt">Bloqueo principal: ${fmt(s.blanksUnits)} unidades en ${s.blanksOrders} órdenes esperando blancos. Eso es ${days(s.blanksUnits, s.last7Daily)} días de producción parada. ${dueNote}</p>
        <p class="sm mt">Calidad no es el rechazo. First-pass es ${pct(b.firstPass)}%. Rechazo QC es ${pct(s.rejectPct)}% de unidades inspeccionadas en 7 días.</p>
        <ol class="actions">
          <li><span>1</span> ${esc(b.a1)}</li>
          <li><span>2</span> ${esc(b.a2)}</li>
          <li><span>3</span> ${esc(b.a3)}</li>
        </ol>
      </article>
    </section>
    <section class="card">
      <p class="kicker">Cada cifra, explicada</p>
      <h2>De dónde sale el digest</h2>
      <p class="sm muted mt">El corte de las 7:30 publica estos renglones desde MOS. Abajo: qué cuenta y cómo leerlo hoy.</p>
      <div class="grid2 mt2">
        ${item("Producido hoy", fmt(s.producedToday), `${s.machines} máquinas · ${fmt(b.per)} c/u`, "Impresiones en production_logs desde medianoche America/Tijuana hasta el corte. No es el cierre de turno; es “hasta ahora”.", "MOS production_logs · corte del día")}
        ${item("Ritmo 7 días", fmt(s.last7Daily) + "/día", `${fmt(s.last7Total)} en 7 días`, "Suma de impresiones de 7 días, dividida entre días de planta. Único ritmo oficial del digest.", "MOS production_logs · ventana 7 días")}
        ${item("En máquina ahora", fmt(s.onMachineUnits), `${s.onMachineJobs} trabajos · ~${b.feedHours.toFixed(1)} h`, "Unidades en tableros MAQUINA*. Trabajo que las prensas ya pueden correr.", "MOS boards MAQUINA*")}
        ${item("Listo para programar", fmt(s.readyUnits), `${s.readyJobs} trabajos`, "Órdenes en READY TO SCHEDULED: arte y BOM listos, aún no cargadas a máquina.", "MOS board READY TO SCHEDULED")}
        ${item("Vencen hoy", fmt(s.dueTodayUnits), `${s.dueTodayOrders} órdenes · ${days(s.dueTodayUnits, s.last7Daily)} días de trabajo`, "Unidades cuya fecha de vencimiento es hoy. Demanda, no capacidad.", "MOS órdenes · due date = hoy", s.dueTodayUnits > 0 ? "warn" : "")}
        ${item("Ya atrasadas", fmt(s.lateUnits), `${days(s.lateUnits, s.last7Daily)} días al ritmo actual`, "Órdenes abiertas con due date anterior a hoy. O se priorizan, o se re-prometen.", "MOS órdenes · due date < hoy", "danger")}

        ${item("Esperando blancos", fmt(s.blanksUnits), `${s.blanksOrders} órdenes · ${days(s.blanksUnits, s.last7Daily)} días parados`, "Board BLANKS: no hay tela/garment. Este es el constraint.", "MOS board BLANKS", "danger")}
        ${item("First-pass (calidad)", pct(b.firstPass) + "%", "Inverso del rechazo de unidades", "Porcentaje de unidades inspeccionadas que no se rechazan. MOS no guarda un score de calidad.", "MOS QC · 1 − (rechazadas / inspeccionadas)", s.rejectPct >= 5 ? "warn" : "ok")}
        ${item("Rechazo QC (7 días)", pct(s.rejectPct) + "%", `~${fmt(b.rejectLoss)} impresiones perdidas/día`, "quantity_rejected / quantity_inspected (unidades, no registros). Apparel sano: 2–5%.", "MOS qc_records · 7 días", s.rejectPct >= 5 ? "danger" : "ok")}
        ${item("Proyección al ritmo", fmt(s.projection), "Si el resto del día corre al promedio 7 días", `El digest publica el ritmo de 7 días como proyección de cierre. Empatar ${fmt(s.last7Daily)} exige ${fmt(b.gap)} más antes de cierre.`, "MOS digest · last7Daily como proxy")}
      </div>
    </section>
    <footer>Corte ${esc(captured)} · fuente digest MOS vivo · se actualiza cada mañana con el post de #Production.</footer>
  </div>`;
    }

    function item(label, value, hint, meaning, source, tone) {
      return `<div class="inner">
          <div class="row"><p class="kicker">${label}</p><p class="num sm ${tone || ""}">${value}</p></div>
          <p class="xs muted">${hint}</p>
          <p class="sm mt">${meaning}</p>
          <p class="xs subtle mt">${source}</p>
        </div>`;
    }

    render(FALLBACK);
    fetch("/digest.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => r.ok ? r.json() : null)
      .then((d) => { if (d && d.producedToday != null) render(d); })
      .catch(() => {});
  </script>
</body>
</html>
